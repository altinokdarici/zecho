<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Zecho Updates</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    :root {
      --bg: #1c1c1e;
      --surface: #2c2c2e;
      --surface-hover: #3a3a3c;
      --text: #f5f5f7;
      --text-secondary: #98989d;
      --accent: #6c5ce7;
      --accent-hover: #7d6ef0;
      --border: rgba(255, 255, 255, 0.08);
      --danger: #ff453a;
      --radius: 14px;
      --radius-sm: 8px;
    }

    body {
      background: var(--bg);
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "SF Pro Display", "Helvetica Neue", sans-serif;
      color: var(--text);
      -webkit-user-select: none;
      user-select: none;
      height: 100vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    .container {
      flex: 1;
      padding: 28px 28px 20px;
      display: flex;
      flex-direction: column;
      gap: 14px;
      min-height: 0;
    }

    .icon {
      width: 56px;
      height: 56px;
      border-radius: 14px;
      background: linear-gradient(135deg, #6c5ce7, #4a3fc7);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 28px;
      flex-shrink: 0;
      align-self: center;
    }

    .icon.success { background: linear-gradient(135deg, #30d158, #1f9d3e); }
    .icon.error { background: linear-gradient(135deg, #ff453a, #c2342b); }

    .title {
      font-size: 18px;
      font-weight: 650;
      letter-spacing: -0.01em;
      text-align: center;
    }

    .subtitle {
      font-size: 13px;
      color: var(--text-secondary);
      text-align: center;
      line-height: 1.5;
    }

    .notes {
      background: var(--surface);
      border-radius: var(--radius-sm);
      padding: 12px 14px;
      font-size: 12px;
      line-height: 1.5;
      color: var(--text-secondary);
      max-height: 110px;
      overflow-y: auto;
      white-space: pre-wrap;
    }

    .progress {
      width: 100%;
      height: 6px;
      background: var(--surface);
      border-radius: 3px;
      overflow: hidden;
    }

    .progress-bar {
      height: 100%;
      background: var(--accent);
      width: 0%;
      transition: width 0.15s ease;
      border-radius: 3px;
    }

    .progress-bar.indeterminate {
      width: 30%;
      animation: indeterminate 1.4s ease-in-out infinite;
    }

    @keyframes indeterminate {
      0%   { transform: translateX(-100%); }
      100% { transform: translateX(400%); }
    }

    .progress-text {
      font-size: 11px;
      color: var(--text-secondary);
      text-align: center;
      font-variant-numeric: tabular-nums;
    }

    .spinner {
      width: 24px;
      height: 24px;
      border: 2.5px solid var(--surface);
      border-top-color: var(--accent);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      align-self: center;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    .footer {
      padding: 14px 28px 20px;
      display: flex;
      gap: 10px;
      justify-content: flex-end;
      flex-shrink: 0;
      border-top: 1px solid var(--border);
    }

    button {
      padding: 8px 18px;
      border-radius: var(--radius-sm);
      border: none;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.15s ease;
      font-family: inherit;
      min-width: 88px;
    }

    button.primary {
      background: var(--accent);
      color: #fff;
    }
    button.primary:hover { background: var(--accent-hover); }
    button.primary:disabled {
      background: var(--surface);
      color: var(--text-secondary);
      cursor: not-allowed;
    }

    button.secondary {
      background: var(--surface);
      color: var(--text);
    }
    button.secondary:hover { background: var(--surface-hover); }
  </style>
</head>
<body>
  <div class="container" id="container"></div>
  <div class="footer" id="footer"></div>

  <script>
    const { invoke } = window.__TAURI__.core;
    const { listen } = window.__TAURI__.event;

    const container = document.getElementById("container");
    const footer = document.getElementById("footer");

    function fmtBytes(n) {
      if (n == null) return "";
      if (n >= 1024 * 1024) return (n / (1024 * 1024)).toFixed(1) + " MB";
      if (n >= 1024) return (n / 1024).toFixed(0) + " KB";
      return n + " B";
    }

    function formatRelativeDate(unix) {
      if (!unix) return "";
      const ms = unix * 1000;
      const days = Math.floor((Date.now() - ms) / (1000 * 60 * 60 * 24));
      if (days <= 0) return "Released today";
      if (days === 1) return "Released yesterday";
      if (days < 30) return `Released ${days} days ago`;
      return `Released on ${new Date(ms).toLocaleDateString()}`;
    }

    async function closeWindow() {
      try { await invoke("close_update_window"); }
      catch (e) { console.error("close_update_window failed:", e); }
    }

    function render(state) {
      switch (state.kind) {
        case "checking":
          container.innerHTML = `
            <div class="spinner"></div>
            <div class="title">Checking for updates…</div>
          `;
          footer.innerHTML = `<button class="secondary" id="close-btn">Close</button>`;
          document.getElementById("close-btn").onclick = closeWindow;
          break;

        case "up_to_date":
          container.innerHTML = `
            <div class="icon success">✓</div>
            <div class="title">You're up to date</div>
            <div class="subtitle">Zecho v${state.current_version} is the latest version.</div>
          `;
          footer.innerHTML = `<button class="primary" id="close-btn">OK</button>`;
          document.getElementById("close-btn").onclick = closeWindow;
          break;

        case "available": {
          const dateText = formatRelativeDate(state.date_unix);
          container.innerHTML = `
            <div class="icon">↑</div>
            <div class="title">Zecho v${state.version} is available</div>
            <div class="subtitle">You have v${state.current_version}.${dateText ? ` ${dateText}.` : ""}</div>
            ${state.notes ? `<div class="notes">${escapeHtml(state.notes)}</div>` : ""}
          `;
          footer.innerHTML = `
            <button class="secondary" id="later-btn">Later</button>
            <button class="primary" id="install-btn">Install &amp; Restart</button>
          `;
          document.getElementById("later-btn").onclick = closeWindow;
          document.getElementById("install-btn").onclick = () => {
            invoke("install_pending_update").catch((err) => console.error(err));
          };
          break;
        }

        case "downloading": {
          const pct = state.total ? Math.min(100, Math.round((state.downloaded / state.total) * 100)) : null;
          const sizeText = state.total
            ? `${fmtBytes(state.downloaded)} of ${fmtBytes(state.total)} (${pct}%)`
            : `${fmtBytes(state.downloaded)} downloaded`;
          container.innerHTML = `
            <div class="title">Downloading v${state.version}…</div>
            <div class="progress">
              <div class="progress-bar ${pct == null ? "indeterminate" : ""}" style="width: ${pct ?? 30}%"></div>
            </div>
            <div class="progress-text">${sizeText}</div>
          `;
          footer.innerHTML = `<button class="secondary" disabled>Downloading…</button>`;
          break;
        }

        case "installing":
          container.innerHTML = `
            <div class="spinner"></div>
            <div class="title">Installing v${state.version}…</div>
            <div class="subtitle">Zecho will restart in a moment.</div>
          `;
          footer.innerHTML = `<button class="secondary" disabled>Restarting…</button>`;
          break;

        case "error":
          container.innerHTML = `
            <div class="icon error">!</div>
            <div class="title">Update failed</div>
            <div class="subtitle">${escapeHtml(state.message)}</div>
          `;
          footer.innerHTML = `
            <button class="secondary" id="close-btn">Close</button>
            <button class="primary" id="retry-btn">Try Again</button>
          `;
          document.getElementById("close-btn").onclick = closeWindow;
          document.getElementById("retry-btn").onclick = startCheck;
          break;
      }
    }

    function escapeHtml(s) {
      return String(s).replace(/[&<>"']/g, (c) => ({
        "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;",
      }[c]));
    }

    function startCheck() {
      invoke("open_update_dialog").catch((err) => {
        render({ kind: "error", message: String(err) });
      });
    }

    listen("update-state", (event) => render(event.payload));
    listen("update-window-opened", () => startCheck());
  </script>
</body>
</html>
