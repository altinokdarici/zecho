name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release (e.g. 0.2.0)"
        required: true
        type: string

jobs:
  set-version:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set version in config files
        run: |
          cd src-tauri
          python3 -c "
          import json
          with open('tauri.conf.json', 'r') as f:
              config = json.load(f)
          config['version'] = '${{ inputs.version }}'
          with open('tauri.conf.json', 'w') as f:
              json.dump(config, f, indent=2)
          "
          sed -i 's/^version = ".*"/version = "${{ inputs.version }}"/' Cargo.toml
      - uses: actions/upload-artifact@v4
        with:
          name: versioned-config
          path: |
            src-tauri/tauri.conf.json
            src-tauri/Cargo.toml

  build-macos:
    needs: set-version
    runs-on: macos-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: versioned-config
          path: src-tauri/

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - name: Install dependencies
        run: brew install cmake

      - name: Build and release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          CMAKE_OSX_DEPLOYMENT_TARGET: "12.0"
          MACOSX_DEPLOYMENT_TARGET: "12.0"
        with:
          tagName: v${{ inputs.version }}
          releaseName: "Zecho v${{ inputs.version }}"
          releaseBody: |
            ## Zecho v${{ inputs.version }}

            Voice-to-clipboard with local AI processing.

            ### Installation
            - **macOS**: Download the `.dmg` file and drag Zecho to Applications
            - **Windows**: Download and run the `.msi` installer

            Models are downloaded automatically on first launch.
            The app auto-updates from future releases.
          releaseDraft: false
          prerelease: false
          args: --target universal-apple-darwin

  build-windows:
    needs: set-version
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: versioned-config
          path: src-tauri/

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install CMake
        uses: lukka/get-cmake@latest

      - name: Build and release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          CMAKE_OSX_DEPLOYMENT_TARGET: "12.0"
          MACOSX_DEPLOYMENT_TARGET: "12.0"
        with:
          tagName: v${{ inputs.version }}
          releaseName: "Zecho v${{ inputs.version }}"
          releaseBody: |
            ## Zecho v${{ inputs.version }}

            Voice-to-clipboard with local AI processing.

            ### Installation
            - **macOS**: Download the `.dmg` file and drag Zecho to Applications
            - **Windows**: Download and run the `.msi` installer

            Models are downloaded automatically on first launch.
            The app auto-updates from future releases.
          releaseDraft: false
          prerelease: false
